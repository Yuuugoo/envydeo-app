<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e15">
    <title>You're offline · Envydeo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
            background: radial-gradient(circle at 50% 30%, #14241a 0%, #0a0e15 55%);
            color: #e7eaf0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
        }
        main { max-width: 22rem; }
        svg { width: 88px; height: 88px; filter: drop-shadow(0 0 18px rgba(98,195,116,.35)); }
        h1 { margin: 24px 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
        p { margin: 0; color: #9aa3b2; line-height: 1.5; }
        button {
            margin-top: 28px; border: 0; border-radius: 14px; padding: 14px 28px; cursor: pointer;
            background: #2f8442; color: #fff; font: inherit; font-weight: 700;
        }
        button:active { transform: scale(.98); }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="4" y1="8" x2="36" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8AD99A"/><stop offset="0.55" stop-color="#4CAF62"/><stop offset="1" stop-color="#2F8442"/></linearGradient></defs>
        <path d="M3.5 20C8.2 11.6 13.7 7.8 20 7.8S31.8 11.6 36.5 20C31.8 28.4 26.3 32.2 20 32.2S8.2 28.4 3.5 20Z" stroke="url(#g)" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M16.6 14.4c0-1.1 1.2-1.8 2.2-1.2l7.4 4.6a1.4 1.4 0 0 1 0 2.4l-7.4 4.6c-1 .6-2.2-.1-2.2-1.2v-9.2Z" fill="url(#g)"/>
    </svg>
    <h1>You’re offline</h1>
    <p>Envydeo needs an internet connection to load movies and Movie Night rooms. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
